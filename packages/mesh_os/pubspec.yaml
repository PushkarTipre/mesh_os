name: mesh_os
description: >
  Public MeshOS SDK: glues mesh_core (identity, crypto, routing) together
  with platform storage and transports, and exposes the app-facing API.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  mesh_core:
    path: ../mesh_core
  mesh_transport_nearby:
    path: ../mesh_transport_nearby
  flutter_secure_storage: ^9.2.2
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13
